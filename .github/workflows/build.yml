name: Build CVs and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: mkdir -p _site

      # ImageMagick (photo safety net) and poppler's pdfunite (combined PDFs), in one apt run
      - name: Install image and PDF tools
        run: |
          missing=""
          command -v mogrify >/dev/null || missing="$missing imagemagick"
          command -v pdfunite >/dev/null || missing="$missing poppler-utils"
          if [ -n "$missing" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $missing; fi

      # Safety net for the published PDFs: strip EXIF/GPS and cap size at 600x600 for any
      # photo in shared/photos (photos should already be prepared before committing)
      - name: Strip metadata from profile photos
        run: |
          shopt -s nullglob nocaseglob
          photos=(shared/photos/*.jpg shared/photos/*.jpeg shared/photos/*.png)
          if [ ${#photos[@]} -eq 0 ]; then echo "No photos"; exit 0; fi
          mogrify -auto-orient -strip -resize '600x600>' "${photos[@]}"
          identify "${photos[@]}"

      # Minimal TeX Live with only the packages the CVs use (listed in .github/texlive-packages.txt),
      # cached between runs instead of pulling the multi-GB full TeX Live image every time
      - name: Install TeX Live (minimal, cached)
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/texlive-packages.txt

      # Each role builds the languages its job.md asks for (Language: fi-first, en-first or en-only;
      # see site/language.py). Each cv-<lang>.tex is compiled twice from inside its folder, so
      # "Page X of Y" and the one-page/multi-page footer check resolve
      - name: Compile each role's CVs with pdflatex
        run: |
          set -e
          for dir in roles/*/; do
            dir=${dir%/}
            role=$(basename "$dir")
            setting=$(python3 site/language.py "$dir")
            for lang in $(python3 site/language.py "$dir" --langs); do
              if [ ! -f "$dir/cv-$lang.tex" ]; then
                echo "::error::$role is $setting but has no cv-$lang.tex"
                exit 1
              fi
              echo "::group::$role ($lang, $setting)"
              (cd "$dir" && pdflatex -interaction=nonstopmode -halt-on-error "cv-$lang.tex" && pdflatex -interaction=nonstopmode -halt-on-error "cv-$lang.tex")
              cp "$dir/cv-$lang.pdf" "_site/david-adegbola-$role-$lang.pdf"
              echo "::endgroup::"
            done
          done

      # One PDF per role, the file that is sent: main language first (fi-first: FI + EN, en-first: EN + FI),
      # or the English CV alone for en-only, so every role has david-adegbola-<role>.pdf
      - name: Combine each role into one PDF
        run: |
          for dir in roles/*/; do
            dir=${dir%/}
            sh shared/combine.sh "$dir" "_site/david-adegbola-$(basename "$dir").pdf"
          done

      # facts.json (contact details for the pages, also read by JobDesk) must match CV-RULES.md
      - name: Check facts.json is up to date
        run: python3 site/facts.py --check

      # Public site: a root page with name and contact only (no list of roles) and one employer page per role
      # at /r/<slug>/ with that role's CV. Every page is noindex. See site/build.py.
      - name: Build employer pages
        run: |
          python3 site/build.py _site
          ls -lR _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
