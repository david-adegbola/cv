name: Build CVs and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Created here (not inside the TeX container, which runs as root) so later steps can write to it
      - run: mkdir -p _site

      # Full TeX Live (includes libertine, fontawesome and babel-finnish). Each roles/<role>/cv-<lang>.tex
      # is compiled twice with pdflatex from inside its folder, so "Page X of Y" resolves.
      - name: Compile every roles/*/cv-*.tex with pdflatex
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            set -e
            for tex in roles/*/cv-*.tex; do
              dir=$(dirname "$tex")
              role=$(basename "$dir")
              name=$(basename "$tex" .tex)
              lang=${name#cv-}
              echo "::group::$role ($lang)"
              (cd "$dir" && pdflatex -interaction=nonstopmode -halt-on-error "$name.tex" && pdflatex -interaction=nonstopmode -halt-on-error "$name.tex")
              cp "$dir/$name.pdf" "_site/david-adegbola-$role-$lang.pdf"
              echo "::endgroup::"
            done

      # Role title comes from the first "# " heading in roles/<role>/job.md (falls back to the folder name).
      # Each role lists its language versions, English first.
      - name: Generate index.html
        run: |
          python3 - <<'PY'
          import glob, html, os
          LANGS = {"en": "English", "fi": "Suomi"}
          order = lambda lang: (list(LANGS).index(lang) if lang in LANGS else len(LANGS), lang)
          items = []
          for role_dir in sorted(glob.glob("roles/*/")):
              role = os.path.basename(role_dir.rstrip("/"))
              langs = sorted((os.path.basename(t)[3:-4] for t in glob.glob(os.path.join(role_dir, "cv-*.tex"))), key=order)
              if not langs:
                  continue
              title = role.replace("-", " ").title()
              job = os.path.join(role_dir, "job.md")
              if os.path.exists(job):
                  for line in open(job, encoding="utf-8"):
                      if line.startswith("# "):
                          title = line[2:].strip()
                          break
              links = "".join(
                  f'<a class="btn" href="david-adegbola-{role}-{lang}.pdf" hreflang="{lang}">'
                  f'{html.escape(LANGS.get(lang, lang.upper()))}</a>'
                  for lang in langs
              )
              items.append(f'      <li><span class="role">{html.escape(title)}</span><span class="langs"><span class="hint">View / Download PDF:</span>{links}</span></li>')
          page = open("index.html", encoding="utf-8").read()
          marker = "      <!-- ROLES: filled in by .github/workflows/build.yml from the roles/ folders -->"
          assert marker in page, "ROLES marker missing from index.html"
          open("_site/index.html", "w", encoding="utf-8").write(page.replace(marker, "\n".join(items)))
          PY
          ls -l _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
