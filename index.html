<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Adegbola – CVs</title>
  <style>
    :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #5b6475; --accent: #0b3d91; --accent-fg: #fff; --card: #fff; --line: #e2e5ea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171c; --fg: #e8ebf0; --muted: #a3abb8; --accent: #5b8def; --accent-fg: #0b1020; --card: #1d2128; --line: #2c313a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); line-height: 1.5; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.9rem; }
    .lead { margin: 0 0 32px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    li { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 20px; }
    li + li { border-top: 1px solid var(--line); }
    .role { font-weight: 600; font-size: 1.1rem; }
    .btn { display: inline-block; padding: 8px 16px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; text-decoration: none; white-space: nowrap; }
    .btn:hover, .btn:focus-visible { filter: brightness(1.1); }
    footer { margin-top: 32px; font-size: .85rem; color: var(--muted); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>David Adegbola – CVs</h1>
    <p class="lead">One CV per job role. Pick a role to view or download the PDF.</p>
    <ul>
      <!-- ROLES: filled in by .github/workflows/build.yml from the roles/ folders -->
    </ul>
    <footer>Source on <a href="https://github.com/david-adegbola/cv">GitHub</a>. Layout adapted from <a href="https://github.com/hmemcpy/cv">hmemcpy/cv</a> (MIT) / Professional CV by Alessandro Plasmati.</footer>
  </main>
</body>
</html>
